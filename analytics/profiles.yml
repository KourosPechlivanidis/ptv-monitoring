analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'analytics/dev.duckdb') }}"
      extensions:
        - httpfs
        - delta
      settings:
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY', '') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_KEY', '') }}"
        s3_region: ap-southeast-2
